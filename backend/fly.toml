# Fly.io deployment config for the backend.
# Deploy with: fly launch (first time) or fly deploy (after that)
# Docs: https://fly.io/docs/apps/

app = "ai-study-assistant-backend"  # change this if the name is taken
primary_region = "iad"              # pick the region closest to your users

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "chroma_data"
  destination = "/app/chroma_data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512